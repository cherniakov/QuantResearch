[project]
name = "quant-research"
version = "0.1.0"
authors = [
    { name = "Aleksei Cherniakov", email = "aleksei.cherniakov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "backtrader==1.9.78.123",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_research*"]
